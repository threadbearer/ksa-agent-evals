[project]
name = "ksa-agent-evals"
version = "0.1.0"
description = "Synthetic-caller evaluation harness for Knight Shift Agents' production agent, built on LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
ksa-evals = "ksa_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksa_evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
